name: Immutable proof-preserving IR optimizer release

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main commit to release
        required: true
        type: string
      source_run_id:
        description: Successful post-main conformance workflow run whose proof artifact is reused
        required: true
        type: string
      release_version:
        description: New 0.x.y version, or an exact annotated tag left by an aborted run
        required: true
        default: 0.1.1
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Bind exact merge and reserve a never-reused release version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(go env GOVERSION)" = "go1.27.0"
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo 'source_run_id must be an integer' >&2; exit 1 ;;
          esac
          case "$RELEASE_VERSION" in
            0.*.*) ;;
            *) echo 'release_version must be 0.x.y' >&2; exit 1 ;;
          esac
          RELEASE_TAG="v$RELEASE_VERSION"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/gooo-proof-preserving-ir-optimizer-release" >> "$GITHUB_ENV"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to reuse existing release $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
            existing_tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
            tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing_tag_object")
            jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null
            echo "EXISTING_TAG=true" >> "$GITHUB_ENV"
            echo "TAG_OBJECT_SHA=$existing_tag_object" >> "$GITHUB_ENV"
          else
            echo "EXISTING_TAG=false" >> "$GITHUB_ENV"
          fi

      - name: Verify and reuse the successful post-main proof artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/semantic-audit.sh
          ./scripts/verify-ci-proof-artifact.sh "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$EXPECTED_SHA" "$EVIDENCE_ROOT"
          cp "$EVIDENCE_ROOT/proof/ci-evidence.json" "$EVIDENCE_ROOT/ci-evidence.json"
          cp "$EVIDENCE_ROOT/proof/conformance/cases/conformance.json" "$EVIDENCE_ROOT/conformance.json"
          jq -e --slurpfile contract contracts/release-reuse-v1.json '
            .fixed_vector == $contract[0].fixed_vector and .generated == $contract[0].generated
          ' "$EVIDENCE_ROOT/ci-evidence.json" >/dev/null
          jq -S -n \
            --arg schema "gooo-proof-preserving-ir-optimizer/release-reuse/v1" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --argjson evidence_artifact_id "$(jq -r '.evidence_artifact.id' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg evidence_artifact_name "$(jq -r '.evidence_artifact.name' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg evidence_artifact_digest "$(jq -r '.evidence_artifact.digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --argjson manifest_artifact_id "$(jq -r '.manifest_artifact.id' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg manifest_artifact_name "$(jq -r '.manifest_artifact.name' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg manifest_artifact_digest "$(jq -r '.manifest_artifact.digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg toolchain_digest "$(jq -r '.toolchain_digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg contract_digest "$(jq -r '.contract_digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg source_digest "$(jq -r '.source_digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --arg ci_evidence_digest "$(jq -r '.ci_evidence_digest' "$EVIDENCE_ROOT/reused-proof.json")" \
            --slurpfile contract contracts/release-reuse-v1.json \
            --slurpfile ci "$EVIDENCE_ROOT/ci-evidence.json" \
            '{schema:$schema,source_run_id:$source_run_id,proof_artifacts:{evidence:{id:$evidence_artifact_id,name:$evidence_artifact_name,digest:$evidence_artifact_digest},manifest:{id:$manifest_artifact_id,name:$manifest_artifact_name,digest:$manifest_artifact_digest}},toolchain_digest:$toolchain_digest,contract_digest:$contract_digest,source_digest:$source_digest,ci_evidence_digest:$ci_evidence_digest,fixed_vector:$ci[0].fixed_vector,generated:$ci[0].generated,tests:{executed:0,reused:2},conformance:{executed:0,reused:1},integration:{executed:0,reused:1},expensive_executions:{before:$contract[0].duplicate_release_baseline.expensive_executions,after:$contract[0].duplicate_release_target.expensive_executions,decision:$contract[0].duplicate_release_target.decision,reason:$contract[0].duplicate_release_target.reason},physical_runner_comparison:$contract[0].physical_runner_comparison}' \
            "$EVIDENCE_ROOT/release-reuse.json"

      - name: Create one annotated tag for the exact merge
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${EXISTING_TAG:-false}" == true ]]; then
            echo "verified existing annotated tag $RELEASE_TAG for $EXPECTED_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "gooo-proof-preserving-ir-optimizer $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null
          echo "TAG_OBJECT_SHA=$tag_object_sha" >> "$GITHUB_ENV"

      - name: Assemble digest-bound release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir="$EVIDENCE_ROOT/release"
          mkdir -p "$release_dir"
          source_asset="gooo-proof-preserving-ir-optimizer-source-$RELEASE_TAG.tar.gz"
          evidence_asset="gooo-proof-preserving-ir-optimizer-evidence-$RELEASE_TAG.tar.gz"
          report_asset="gooo-proof-preserving-ir-optimizer-report-$RELEASE_TAG.json"
          git archive --format=tar.gz --prefix="gooo-proof-preserving-ir-optimizer-$RELEASE_TAG/" "$EXPECTED_SHA" > "$release_dir/$source_asset"
          tar -czf "$release_dir/$evidence_asset" -C "$EVIDENCE_ROOT/proof" conformance integration-output ci-evidence.json -C "$EVIDENCE_ROOT" reused-proof.json release-reuse.json
          jq -S -n --arg schema "gooo-proof-preserving-ir-optimizer/release-report/v1" --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" --arg tag_object "$TAG_OBJECT_SHA" --slurpfile conformance "$EVIDENCE_ROOT/conformance.json" --slurpfile metrics "$EVIDENCE_ROOT/ci-evidence.json" --slurpfile reuse "$EVIDENCE_ROOT/release-reuse.json" '{schema:$schema,version:$version,tag:$tag,merge_sha:$commit,annotated_tag_object_sha:$tag_object,immutable_required:true,fixed_vector:$conformance[0].summary,exact_metrics:$metrics[0],release_reuse:$reuse[0]}' > "$release_dir/$report_asset"
          source_digest="sha256:$(sha256sum "$release_dir/$source_asset" | awk '{print $1}')"
          evidence_digest="sha256:$(sha256sum "$release_dir/$evidence_asset" | awk '{print $1}')"
          report_digest="sha256:$(sha256sum "$release_dir/$report_asset" | awk '{print $1}')"
          manifest="$release_dir/release-manifest.json"
          jq -S -n --arg schema "gooo-proof-preserving-ir-optimizer/release-manifest/v1" --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" --arg tag_object "$TAG_OBJECT_SHA" --arg source_name "$source_asset" --arg source_digest "$source_digest" --arg evidence_name "$evidence_asset" --arg evidence_digest "$evidence_digest" --arg report_name "$report_asset" --arg report_digest "$report_digest" --slurpfile metrics "$EVIDENCE_ROOT/ci-evidence.json" --slurpfile reuse "$EVIDENCE_ROOT/release-reuse.json" '{schema:$schema,version:$version,tag:$tag,merge_sha:$commit,annotated_tag_object_sha:$tag_object,immutable:true,assets:[{name:$source_name,digest:$source_digest},{name:$evidence_name,digest:$evidence_digest},{name:$report_name,digest:$report_digest}],fixed_vector:$metrics[0].fixed_vector,generated:$metrics[0].generated,release_reuse:$reuse[0],authority:{repository_writes:0,automatic_commit:0,automatic_push:0,automatic_merge:0,automatic_release:0}}' > "$manifest"
          (cd "$release_dir" && sha256sum "$source_asset" "$evidence_asset" "$report_asset" release-manifest.json > SHA256SUMS)

      - name: Create draft release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$RELEASE_TAG" -f target_commitish="$EXPECTED_SHA" -f name="gooo-proof-preserving-ir-optimizer $RELEASE_TAG" -f body="Immutable evidence-bound release for merge $EXPECTED_SHA." -F draft=true -F prerelease=false)
          test "$(jq -r '.draft' <<<"$release_json")" = true
          echo "RELEASE_ID=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_ENV"

      - name: Upload draft assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" \
            "$EVIDENCE_ROOT/release/gooo-proof-preserving-ir-optimizer-source-$RELEASE_TAG.tar.gz" \
            "$EVIDENCE_ROOT/release/gooo-proof-preserving-ir-optimizer-evidence-$RELEASE_TAG.tar.gz" \
            "$EVIDENCE_ROOT/release/gooo-proof-preserving-ir-optimizer-report-$RELEASE_TAG.json" \
            "$EVIDENCE_ROOT/release/release-manifest.json" \
            "$EVIDENCE_ROOT/release/SHA256SUMS"

      - name: Publish draft release once
        shell: bash
        run: |
          set -Eeuo pipefail
          published=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false)
          test "$(jq -r '.draft' <<<"$published")" = false

      - name: Verify public immutable release and all asset digests
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" --arg tag_object "$TAG_OBJECT_SHA" '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true and .target_commitish == $commit' <<<"$release_json" >/dev/null
          for asset_path in "$EVIDENCE_ROOT/release"/gooo-proof-preserving-ir-optimizer-source-*.tar.gz "$EVIDENCE_ROOT/release"/gooo-proof-preserving-ir-optimizer-evidence-*.tar.gz "$EVIDENCE_ROOT/release"/gooo-proof-preserving-ir-optimizer-report-*.json "$EVIDENCE_ROOT/release/release-manifest.json" "$EVIDENCE_ROOT/release/SHA256SUMS"; do
            name=$(basename "$asset_path")
            digest="sha256:$(sha256sum "$asset_path" | awk '{print $1}')"
            actual=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")
            test "$actual" = "$digest"
          done
          jq -e --arg commit "$EXPECTED_SHA" --arg tag_object "$TAG_OBJECT_SHA" '.merge_sha == $commit and .annotated_tag_object_sha == $tag_object and .immutable == true' "$EVIDENCE_ROOT/release/release-manifest.json" >/dev/null
          cat "$EVIDENCE_ROOT/release/release-manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "release_url=$(jq -r '.html_url' <<<"$release_json")" >> "$GITHUB_STEP_SUMMARY"
